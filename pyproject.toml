[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "career-match-agent"
version = "0.1.0"
description = "Explainable AI agent for CV-based job search and recommendation"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "AGPL-3.0-only"
license-files = ["LICENSE", "COPYRIGHT"]
authors = [
    { name = "A. Umut Gokdemir" }
]
dependencies = [
    "fastapi>=0.115",
    "google-genai>=2.3,<3",
    "httpx>=0.28,<1",
    "langgraph>=1.2,<1.3",
    "numpy>=2,<3",
    "ollama>=0.6,<1",
    "openai>=3,<4",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "pymupdf>=1.26,<2",
    "python-multipart>=0.0.20",
    "sentence-transformers>=5,<6",
    "uvicorn[standard]>=0.34",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.14",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.9"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
ignore = ["E501"]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["career_match_agent"]
